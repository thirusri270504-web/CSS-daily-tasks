<!DOCTYPE html>

<html lang="en">

<head>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS Daily Tasks</title>

<style>

    /* =================================================
       RESET
    ================================================= */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    /* =================================================
       BODY
    ================================================= */

    body {
        font-family: Arial, Helvetica, sans-serif;

        background:
            linear-gradient(
                135deg,
                #f8f5ff,
                #eefcff
            );

        color: #20203a;

        min-height: 100vh;
    }


    /* =================================================
       HEADER
    ================================================= */

    nav {

        background:
            linear-gradient(
                135deg,
                #24104f,
                #552583,
                #008b8b
            );

        padding: 24px 20px;

        text-align: center;

        box-shadow:
            0 8px 25px rgba(36, 16, 79, 0.25);

        position: sticky;

        top: 0;

        z-index: 100;
    }


    nav h2 {

        color: #ffffff;

        font-size: 26px;

        letter-spacing: 2px;

        text-transform: uppercase;
    }


    /* =================================================
       MAIN CONTAINER
    ================================================= */

    .container {

        width: 90%;

        max-width: 1100px;

        margin: 70px auto;

        min-height: 70vh;
    }


    /* =================================================
       HEADING
    ================================================= */

    .heading {

        text-align: center;

        margin-bottom: 55px;
    }


    .heading h1 {

        font-size: 44px;

        font-weight: 800;

        color: #24104f;

        margin-bottom: 14px;

        letter-spacing: 1px;
    }


    .heading h1 span {

        color: #008b8b;
    }


    .heading p {

        color: #68687d;

        font-size: 17px;

        letter-spacing: 0.5px;
    }


    /* =================================================
       TASK GRID
    ================================================= */

    .tasks {

        display: grid;

        grid-template-columns:
            repeat(6, 1fr);

        gap: 28px;
    }


    /* =================================================
       TASK CARD
    ================================================= */

    .task {

        background: rgba(255, 255, 255, 0.9);

        padding: 34px 25px;

        border-radius: 20px;

        text-align: center;

        border: 1px solid #e5ddf5;

        box-shadow:
            0 10px 30px rgba(55, 35, 100, 0.10);

        transition:
            transform 0.3s ease,
            box-shadow 0.3s ease,
            border-color 0.3s ease;

        position: relative;

        overflow: hidden;
    }


    /* TOP COLOR LINE */

    .task::before {

        content: "";

        position: absolute;

        top: 0;

        left: 0;

        width: 100%;

        height: 5px;

        background:
            linear-gradient(
                90deg,
                #ff6b6b,
                #f7b731,
                #008b8b
            );
    }


    /* CARD HOVER */

    .task:hover {

        transform:
            translateY(-10px);

        border-color: #bca8e8;

        box-shadow:
            0 18px 40px
            rgba(55, 35, 100, 0.18);
    }


    /* =================================================
       DAY TITLE
    ================================================= */

    .task h3 {

        display: inline-block;

        color: #552583;

        background:
            #f1eaff;

        padding: 8px 18px;

        border-radius: 30px;

        font-size: 18px;

        margin-bottom: 18px;

        font-weight: 700;
    }


    /* =================================================
       DESCRIPTION
    ================================================= */

    .task p {

        color: #68687d;

        margin-bottom: 25px;

        font-size: 15px;

        line-height: 1.6;
    }


    /* =================================================
       VIEW TASK BUTTON
    ================================================= */

    .task a {

        display: inline-block;

        text-decoration: none;

        color: white;

        background:
            linear-gradient(
                135deg,
                #552583,
                #008b8b
            );

        padding:
            12px 23px;

        border-radius: 10px;

        font-size: 14px;

        font-weight: bold;

        letter-spacing: 0.5px;

        transition:
            transform 0.3s ease,
            box-shadow 0.3s ease,
            background 0.3s ease;

        box-shadow:
            0 7px 18px
            rgba(85, 37, 131, 0.25);
    }


    /* BUTTON HOVER */

    .task a:hover {

        transform:
            translateY(-3px);

        background:
            linear-gradient(
                135deg,
                #ff6b6b,
                #f7b731
            );

        box-shadow:
            0 10px 22px
            rgba(255, 107, 107, 0.30);
    }


    /* =================================================
       DESKTOP LAYOUT
       3 CARDS FIRST ROW
       2 CARDS SECOND ROW
    ================================================= */

    .task:nth-child(1),
    .task:nth-child(2),
    .task:nth-child(3) {

        grid-column:
            span 2;
    }


    .task:nth-child(4) {

        grid-column:
            2 / span 2;
    }


    .task:nth-child(5) {

        grid-column:
            4 / span 2;
    }


    /* =================================================
       FOOTER
    ================================================= */

    footer {

        background:
            linear-gradient(
                135deg,
                #24104f,
                #552583
            );

        color: white;

        text-align: center;

        padding: 30px 20px;

        margin-top: 80px;
    }


    footer p {

        margin: 7px;

        font-size: 14px;

        color: #ddd5ee;
    }


    footer strong {

        color: #45d6d6;
    }


    /* =================================================
       TABLET
    ================================================= */

    @media (max-width: 800px) {

        .container {

            width: 88%;

            margin:
                50px auto;
        }


        .heading h1 {

            font-size: 36px;
        }


        .tasks {

            grid-template-columns:
                repeat(2, 1fr);

            gap: 24px;
        }


        .task:nth-child(n) {

            grid-column:
                auto;
        }

    }


    /* =================================================
       MOBILE
    ================================================= */

    @media (max-width: 550px) {

        nav {

            padding:
                20px 15px;
        }


        nav h2 {

            font-size: 21px;

            letter-spacing: 1px;
        }


        .container {

            width: 88%;

            margin:
                40px auto;
        }


        .heading {

            margin-bottom:
                35px;
        }


        .heading h1 {

            font-size: 30px;

            line-height: 1.3;
        }


        .heading p {

            font-size: 15px;

            line-height: 1.6;
        }


        .tasks {

            grid-template-columns:
                1fr;

            gap: 22px;
        }


        .task:nth-child(n) {

            grid-column:
                auto;
        }


        .task {

            padding:
                30px 22px;
        }


        footer {

            margin-top:
                50px;
        }

    }

</style>

</head>
